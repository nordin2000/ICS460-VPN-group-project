name: ics460c

services:
  # Museum server and webpage from Rose's Bundle A (65c8ade).
  museum:
    image: nginx:alpine
    container_name: ics460c-museum
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      private:
        ipv4_address: 172.28.0.10

  # VPN gateway connects the client network to the museum network.
  hub:
    build: .
    image: ics460c-lab:local
    container_name: ics460c-hub
    command: node-start hub
    cap_add:
      - NET_ADMIN  # Lets this container set up its VPN interface.
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - hub-state:/etc/wireguard
    networks:
      outer:
        ipv4_address: 172.29.0.2
      private:
        ipv4_address: 172.28.0.2

  # Remote sites have separate keys and only join the outer network.
  north:
    build: .
    image: ics460c-lab:local
    container_name: ics460c-north
    command: node-start client
    cap_add:
      - NET_ADMIN
    volumes:
      - client-state:/etc/wireguard
    networks:
      outer:
        ipv4_address: 172.29.0.3

  east:
    build: .
    image: ics460c-lab:local
    container_name: ics460c-east
    command: node-start client
    cap_add:
      - NET_ADMIN
    volumes:
      - east-state:/etc/wireguard
    networks:
      outer:
        ipv4_address: 172.29.0.4

  west:
    build: .
    image: ics460c-lab:local
    container_name: ics460c-west
    command: node-start client
    cap_add:
      - NET_ADMIN
    volumes:
      - west-state:/etc/wireguard
    networks:
      outer:
        ipv4_address: 172.29.0.5

# Two separate networks; only the hub joins both.
networks:
  outer:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
# Keep keys and configs when containers are stopped.
volumes:
  hub-state:
  client-state:
  east-state:
  west-state:
