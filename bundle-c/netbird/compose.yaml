name: ics460-netbird

services:
  # Reuse our enrolled test device as the museum-side VPN endpoint.
  server:
    image: netbirdio/netbird:0.83.2
    hostname: suraz-lab-check
    entrypoint: netbird
    command: service run --log-file console
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - server-state:/var/lib/netbird
    networks:
      - server-outer

  # Rose's webpage uses the server's VPN connection.
  museum:
    image: nginx:alpine
    network_mode: service:server
    volumes:
      - ../lab/web:/usr/share/nginx/html:ro
      - ./museum.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

  client:
    image: netbirdio/netbird:0.83.2
    hostname: suraz-lab-client
    entrypoint: netbird
    command: service run --log-file console
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - client-state:/var/lib/netbird
    networks:
      - client-outer

# Separate networks prevent a direct Docker path between client and server.
networks:
  server-outer:
  client-outer:

volumes:
  server-state:
    external: true
    name: ics460-netbird-check
  client-state:
